[package]
name = "appcast"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["cli"]
cli = []
# Future frontends, kept out of the default build so `run` stays tiny and instant.
tui = ["dep:ratatui", "dep:crossterm"]
web = ["dep:axum"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
etcetera = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"

# Optional deps for future frontends (never compiled unless the feature is on).
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
axum = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
strip = true
lto = true
