[workspace]
members = [".", "sdk/appcast-plugin", "plugins/webview"]
# Bare-shell `cargo test` / `clippy` iterate on the core only: the webview
# member needs the WebKitGTK stack (use `nix develop .#plugin -c` for
# workspace-wide runs). resolver pinned for the whole workspace.
default-members = [".", "sdk/appcast-plugin"]
resolver = "2"

[package]
name = "appcast"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"

[features]
default = [
  "cli",
  "adapter-adb",
  "adapter-browser",
  "adapter-ssh",
  "adapter-waypipe",
]
cli = []
# Every built-in transporter is individually toggleable; each feature owns
# this adapter's exclusive dependencies (shared core deps stay unconditional).
adapter-adb = ["dep:regex"]
adapter-browser = []
adapter-ssh = []
adapter-waypipe = []
# Future frontends, kept out of the default build so `run` stays tiny and instant.
tui = ["dep:ratatui", "dep:crossterm"]
web = ["dep:axum"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
etcetera = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "1.0"
regex = { version = "1.10", optional = true }
libloading = "0.8"

# Optional deps for future frontends (never compiled unless the feature is on).
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
axum = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
strip = true
lto = true
